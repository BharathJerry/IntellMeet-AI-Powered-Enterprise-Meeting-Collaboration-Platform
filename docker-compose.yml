# One command for judges and teammates:  docker compose up --build
# Then open http://localhost:5173   (API on http://localhost:5000)
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/intellmeet
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      # local development defaults only: use real secrets in production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_dev_refresh_secret_change_me}
      AI_MODE: mock
    depends_on: [mongo, redis]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mongo-data:
